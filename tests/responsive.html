<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK3 · Responsive QA</title>
<style>body{margin:20px;font:16px system-ui;background:#edf0e8}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}select{padding:10px}iframe{border:1px solid #aaa;display:block;background:white;height:1050px}#surface{overflow:auto}a{color:#176349}</style>
<header><strong>Kiểm tra responsive</strong><label>Bề rộng <select id="width"><option>360</option><option>390</option><option>768</option><option>1440</option></select></label><label>Trang <select id="route"><option value="today">Hôm nay</option><option value="lesson/hsk1-l01/reader?passage=tb-dialogue-2">Nghe & đọc</option><option value="lesson/hsk1-l01/exercises">Bài tập</option><option value="lesson/hsk1-l01/knowledge">Kiến thức</option><option value="course">Lộ trình</option><option value="settings">Cài đặt</option></select></label><a href="../">Về ứng dụng</a></header><div id="surface"><iframe title="Ứng dụng tại bề rộng kiểm tra" src="../#/today" width="360"></iframe></div>
<script>const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>frame.style.width=e.target.value+'px';document.querySelector('#route').onchange=e=>frame.src='../#/'+e.target.value;</script></html>
